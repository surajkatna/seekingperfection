<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaGrocery | Premium Online Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #030712; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-[#111827]/95 border-b border-amber-500/20 backdrop-blur-md shadow-xl transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Main Header Row -->
            <div class="h-24 flex items-center justify-between gap-4">
                
                <!-- Brand Logo -->
                <div class="flex items-center space-x-3 group cursor-pointer shrink-0">
                    <div class="p-2 border border-amber-500 bg-[#030712] transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3 shadow-lg group-hover:shadow-amber-500/20">
                        <i data-lucide="shopping-cart" class="w-8 h-8 text-amber-500"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-wider text-amber-500 transition-colors duration-300 group-hover:text-amber-400">INSTAGROCERY</h1>
                        <p class="text-[9px] sm:text-[10px] tracking-widest text-gray-400 uppercase font-light transition-colors duration-300 group-hover:text-gray-300">Your Premium Online Supermarket</p>
                    </div>
                </div>

                <!-- Desktop Search Bar (Hidden on Mobile) -->
                <div class="hidden md:flex flex-1 max-w-md mx-8 relative group">
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search from 200+ products..." 
                        class="w-full bg-[#1f2937] border border-gray-700 px-5 py-2.5 text-sm rounded-md text-white placeholder-gray-400 focus:outline-none focus:border-amber-500 focus:bg-[#111827] focus:shadow-[0_0_15px_rgba(245,158,11,0.15)] transition-all duration-300">
                    <i data-lucide="search" class="absolute right-4 top-3.5 w-4 h-4 text-gray-400 transition-colors duration-300 group-focus-within:text-amber-500"></i>
                </div>

                <!-- Cart Trigger -->
                <button onclick="toggleCart(true)" class="relative p-3 border border-gray-700 bg-[#1f2937] hover:border-amber-500 hover:bg-[#111827] rounded-md transition-all duration-300 group shadow-md hover:shadow-[0_0_15px_rgba(245,158,11,0.2)] shrink-0">
                    <i data-lucide="shopping-bag" class="w-6 h-6 text-amber-500 group-hover:scale-110 transition-transform duration-300"></i>
                    <span id="cartCountBadge" class="absolute -top-2 -right-2 bg-amber-500 text-gray-900 text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-[#030712] transition-transform duration-300 group-hover:scale-110">0</span>
                </button>
            </div>

            <!-- Responsive Mobile Search Bar (Visible on Mobile Only) -->
            <div class="block md:hidden pb-5 relative group">
                <input type="text" id="searchInputMobile" oninput="handleMobileSearch()" placeholder="Search from 200+ products..." 
                    class="w-full bg-[#1f2937] border border-gray-700 px-5 py-2.5 text-sm rounded-md text-white placeholder-gray-400 focus:outline-none focus:border-amber-500 focus:bg-[#111827] focus:shadow-[0_0_15px_rgba(245,158,11,0.15)] transition-all duration-300">
                <i data-lucide="search" class="absolute right-4 top-3 w-4 h-4 text-gray-400 transition-colors duration-300 group-focus-within:text-amber-500"></i>
            </div>
        </div>
    </header>

    <!-- MAIN INTERFACE -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Category Filter Tabs (Generated dynamically via Javascript) -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="categoryTabs"></div>

        <!-- Dynamic Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Items rendered via JS -->
        </div>

        <!-- Pagination Controls -->
        <div class="flex justify-center items-center space-x-6 mt-16 pt-8 border-t border-gray-800">
            <button onclick="changePage(-1)" id="prevBtn" class="p-2 border border-gray-700 bg-[#1f2937] rounded-md disabled:opacity-30 disabled:cursor-not-allowed hover:border-amber-500 hover:bg-[#111827] transition-all duration-300 active:scale-90">
                <i data-lucide="chevron-left" class="w-5 h-5 text-amber-500"></i>
            </button>
            <span id="pageIndicator" class="text-xs tracking-widest text-gray-400 uppercase">Page <span id="currentPageNum" class="text-amber-500 font-bold">1</span> of <span id="totalPagesNum">1</span></span>
            <button onclick="changePage(1)" id="nextBtn" class="p-2 border border-gray-700 bg-[#1f2937] rounded-md disabled:opacity-30 disabled:cursor-not-allowed hover:border-amber-500 hover:bg-[#111827] transition-all duration-300 active:scale-90">
                <i data-lucide="chevron-right" class="w-5 h-5 text-amber-500"></i>
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#111827] border-t border-gray-800 py-8 mt-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-xs tracking-widest text-gray-500 uppercase">© 2026 INSTAGROCERY ONLINE SERVICES. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <!-- SLIDING CART DRAWER -->
    <div id="cartDrawer" class="fixed inset-0 z-50 pointer-events-none hidden">
        <div onclick="toggleCart(false)" class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity opacity-0 pointer-events-auto duration-300" id="cartBackdrop"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-[#111827] border-l border-gray-800 shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 pointer-events-auto" id="cartPanel">
            
            <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-[#1f2937]">
                <div class="flex items-center space-x-2">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-amber-500"></i>
                    <h2 class="text-lg font-bold tracking-wide text-white">Your Shopping Cart</h2>
                </div>
                <button onclick="toggleCart(false)" class="p-1.5 hover:bg-gray-800 rounded-md text-gray-400 hover:text-white transition-colors duration-200">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Cart Items Container -->
            <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

            <!-- Checkout Details Form -->
            <div class="p-6 border-t border-gray-800 bg-[#1f2937] space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Delivery Address</label>
                    <input type="text" id="deliveryAddress" placeholder="Enter your full shipping address" class="w-full bg-[#030712] border border-gray-700 rounded-md px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 focus:shadow-[0_0_10px_rgba(245,158,11,0.1)] transition-all duration-300">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Payment Method</label>
                    <select id="paymentMethod" class="w-full bg-[#030712] border border-gray-700 rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors duration-300">
                        <option value="Cash on Delivery">Cash on Delivery (COD)</option>
                        <option value="UPI / Online Payment">UPI / Net Banking</option>
                        <option value="Credit / Debit Card">Credit or Debit Card</option>
                    </select>
                </div>
                
                <!-- Totals -->
                <div class="pt-4 border-t border-gray-700 space-y-2 text-sm">
                    <div class="flex justify-between text-gray-400">
                        <span>Items Subtotal</span>
                        <span id="subtotalVal">₹0</span>
                    </div>
                    <div class="flex justify-between text-gray-400">
                        <span>Shipping Fee</span>
                        <span class="text-green-500 font-semibold uppercase text-xs tracking-wider">Free Delivery</span>
                    </div>
                    <div class="flex justify-between text-lg font-bold text-white pt-2 border-t border-gray-700">
                        <span>Grand Total</span>
                        <span id="totalVal" class="text-amber-400">₹0</span>
                    </div>
                </div>

                <!-- WhatsApp Button -->
                <button onclick="processOrder()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-gray-900 py-3 rounded-md font-bold tracking-wider text-sm uppercase shadow-lg hover:shadow-amber-500/20 transition-all duration-300">
                    Place Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Script Entry Link -->
    <script src="script.js"></script>
</body>
</html>
